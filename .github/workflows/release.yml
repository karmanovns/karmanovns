name: Publish Blender add-on release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Build Blender install archive
        run: python scripts/build_addon.py

      - name: Publish archive in GitHub Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" dist/td_light_bridge.zip \
            --title "TouchDesigner Light Bridge ${{ github.ref_name }}" \
            --generate-notes
